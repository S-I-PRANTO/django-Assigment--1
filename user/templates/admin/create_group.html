{% extends 'adminNav.html' %}
{% block show %}

<div class=" w-4/6 bg-rose-500 m-auto mt-10 p-6 rounded ">
    {% if messages %}
        {% for message in messages %}
            <div class="px-2 py-1 w-4/6 border rounded-lg text-white m-3
                {% if message.tags == 'success' %}bg-green-500
                {% elif message.tags == 'warning' %}bg-orange-400
                {% elif message.tags == 'error' %}bg-red-600
                {% endif %}">
                {{ message }}
            </div>
    {% endfor %}
    {% endif %} 
    <form action="" method="POST">
        {% csrf_token %}
        {{form.as_p}}
        <button class=" border px-2 mt-2 py-1 text-white bg-rose-600 rounded">Create_Group</button>
    </form>
</div>


{% endblock show %}
